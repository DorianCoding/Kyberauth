[package]
name = "kyberauth"
version = "0.8.0"
authors = ["DorianCoding"]
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["cryptography","kem","aes256"]
categories = ["authentication","cryptography"]
description = "Enable AES keys transfer on unsecure channel using quantum-resistant Kyber"
repository = "https://github.com/DorianCoding/Kyberauth"
rust-version = "1.85"
[dependencies]
aes-gcm = { version = "~0.10.3", optional = true }
rand_core = { version = "~0.6.4", optional = true}
futures = "~0.3.32"
hex = "~0.4.3"
quinn = "0.11.11"
rcgen = "0.14.7"
rustls = { version = "0.23.41", features = ["aws_lc_rs"] }
safe_pqc_kyber = { version = "0.6.3", features = ["zeroize", "std"] }
sha3 = "~0.12.0"
tokio = { version = "~1.52.3", features = ["net", "rt", "io-util", "macros", "time"] }
winapi = "~0.3.9"
zeroize = "1.9"
[lints.rust]
unsafe_code = "warn"
[badges]
maintenance = {status = "passively-maintained" }
[features]
aes = ["dep:aes-gcm"]
default = ["aes", "rand"]
server = []
client = ["rand_core"]
rand = ["rand_core"]
